name: 💡 Feature Request
description: Propose a new feature, tool, model provider, or UX enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Berkelium Codex more powerful, fast, or extensible? We welcome proposals that align with our core principles: model neutrality, terminal-native speed, strict safety, and local autonomy.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: I am always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: Add a new tool or command that...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches or workarounds have you explored?
    validations:
      required: false
  - type: dropdown
    id: target_subsystem
    attributes:
      label: Target Subsystem
      options:
        - TUI / Command Palette (CLI)
        - Agent Kernel & Autonomous Loop
        - Tool System & MCP
        - Context Engine & Repo Mapping
        - Security & Permissions
        - Provider Adapters (Local / Cloud)
        - Subagents & Missions
        - Documentation & Benchmarks
    validations:
      required: true
