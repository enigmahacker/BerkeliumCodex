version: 1
default_model: coding
theme:
  name: berkelium-dark
ui:
  launch_animation: true
  hackathon_mode: false
permissions:
  filesystem:
    read: allow
    write:
      workspace: allow
      outside_workspace: allow
    delete:
      workspace: allow
      outside_workspace: ask
  shell:
    safe: allow
    destructive: ask
