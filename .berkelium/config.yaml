providers:
  openrouter:
    enabled: true
    base_url: https://openrouter.ai/api/v1
    timeout_ms: 60000
  nvidia:
    enabled: true
    base_url: https://integrate.api.nvidia.com/v1
    timeout_ms: 60000
  gemini:
    enabled: true
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    timeout_ms: 60000
  huggingface:
    enabled: true
    base_url: https://router.huggingface.co/hf-inference/v1
    timeout_ms: 60000
  groq:
    enabled: true
    base_url: https://api.groq.com/openai/v1
    timeout_ms: 60000
  ollama:
    enabled: true
    base_url: http://127.0.0.1:11434
    timeout_ms: 60000
  lmstudio:
    enabled: true
    base_url: http://127.0.0.1:1234/v1
    timeout_ms: 60000
agent:
  max_iterations: 40
  max_tool_retries: 3
  auto_compact: true
  verify_changes: true
  timeout_seconds: 300
tools:
  shell: true
  filesystem: true
  git: true
  web: true
  diagnostics: true
prompt: {}
runtime:
  default: auto
  mlx:
    enabled: true
    server_port: 8321
  gguf:
    enabled: true
    server_port: 8322
  cpu:
    enabled: true
model_storage:
  auto_prune: false
privacy:
  mode: balanced
  cloud_escalation_prompt: true
  sensitive_patterns: []
cost:
  enabled: false
  warn_threshold_percent: 80
cloud:
  enabled: true
mode: auto
