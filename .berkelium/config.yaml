version: 1
default_model: coding
theme:
  name: berkelium-dark
ui:
  launch_animation: true
  hackathon_mode: false
  launch_animation_duration_ms: 1200
  launch_matrix: true
  density: compact
  unicode: true
permissions:
  filesystem:
    read: allow
    write:
      workspace: allow
      outside_workspace: allow
    delete:
      workspace: allow
      outside_workspace: ask
  shell:
    safe: allow
    destructive: ask
    privileged: deny
  level: auto
  network:
    default: ask
    allowed_domains: []
effort: max
routing:
